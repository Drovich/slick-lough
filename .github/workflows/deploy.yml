name: Build & Deploy vers OVH

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Installe Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Installe les dépendances
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_PARTICIPANT_PASSWORD_HASH: ${{ secrets.PUBLIC_PARTICIPANT_PASSWORD_HASH }}
          PUBLIC_ARBITRE_PASSWORD_HASH: ${{ secrets.PUBLIC_ARBITRE_PASSWORD_HASH }}
          PUBLIC_ADMIN_PASSWORD_HASH: ${{ secrets.PUBLIC_ADMIN_PASSWORD_HASH }}

      - name: Déploie vers OVH via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ssl:verify-certificate no;
            set ftp:passive-mode on;
            open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
            mirror --reverse --delete --verbose --parallel=4 dist/ /www/;
          "
